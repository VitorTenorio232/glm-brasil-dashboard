name: Testes do site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (erros reais, como nomes indefinidos)
        run: python -m ruff check app.py src tests --select F

      - name: Testes automatizados
        run: python -m pytest -q

      - name: O site abre e mostra as abas
        run: |
          python - <<'EOF'
          import os
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file(os.path.abspath("app.py"), default_timeout=240).run()
          assert not at.exception, at.exception
          print("Abas:", [t.label for t in at.tabs])
          assert len(at.tabs) >= 5, "o app não renderizou as abas"
          EOF
